
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azoity bio</title>
    <style>
        :root {
            --bg: #000; --text: #fff; --card-bg: rgba(15,15,15,0.75);
            --accent: #ff4757; --border: rgba(255,71,87,0.15);
            --glow: rgba(255,71,87,0.1); --snow-color: rgba(255,255,255,0.8);
            --common: #95a5a6; --rare: #3498db; --epic: #9b59b6; --legendary: #f39c12;
            --gradient-1: #ff4757; --gradient-2: #9b59b6; --gradient-3: #3498db;
        }
        [data-theme="light"] {
            --bg: #f0f0f0; --text: #1a1a1a; --card-bg: rgba(255,255,255,0.85);
            --accent: #d63031; --border: rgba(214,48,49,0.15);
            --glow: rgba(214,48,49,0.1); --snow-color: rgba(0,0,0,0.15);
            --gradient-1: #ff6b81; --gradient-2: #a29bfe; --gradient-3: #74b9ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        
        .cursor { 
            width: 20px; height: 20px; 
            border: 2px solid var(--accent); 
            border-radius: 50%; 
            position: fixed; 
            pointer-events: none; 
            z-index: 9999; 
            transition: transform 0.1s; 
            mix-blend-mode: difference;
            box-shadow: 0 0 10px var(--accent);
        }
        .ripple { 
            position: fixed; 
            border-radius: 50%; 
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2)); 
            opacity: 0.4; 
            pointer-events: none; 
            animation: rippleAnim 0.6s ease-out forwards; 
            z-index: 9998; 
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            min-height: 100vh; 
            color: var(--text); 
            background: var(--bg); 
            overflow-x: hidden; 
            transition: background 0.5s, color 0.5s; 
        }
        
        .parallax-bg { 
            position: fixed; 
            top: -10%; left: 0; 
            width: 100%; height: 120%; 
            background-image: url('https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUycHU4cXBjMHJldWtjM3J1a3B4dGJqZzQwbzhpZzQ4Ymcxc25jNGprOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/4ilFRqgbzbx4c/giphy.gif'); 
            background-size: cover; 
            background-position: center; 
            z-index: -2; 
            transition: transform 0.1s linear; 
        }
        .overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.65); 
            z-index: -1; 
            transition: background 0.5s; 
        }
        [data-theme="light"] .overlay { background: rgba(255,255,255,0.4); }

        .snowflake { 
            position: fixed; 
            top: -10px; 
            background: var(--snow-color); 
            border-radius: 50%; 
            pointer-events: none; 
            z-index: -1; 
            animation: fall linear infinite; 
        }
        @keyframes fall { to { transform: translateY(110vh); } }

        nav { 
            position: fixed; 
            top: 0; left: 0; right: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 100; 
            backdrop-filter: blur(10px); 
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border);
        }
        [data-theme="light"] nav { background: rgba(255,255,255,0.3); }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { 
            color: var(--text); 
            text-decoration: none; 
            font-weight: bold; 
            transition: all 0.3s;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gradient-1), var(--gradient-2));
            transition: width 0.3s;
        }
        .nav-links a:hover::after { width: 100%; }
        .burger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
        .burger span { width: 25px; height: 3px; background: var(--text); transition: 0.3s; }
        @media (max-width: 768px) {
            .nav-links { 
                position: fixed; 
                top: 0; right: -100%; 
                width: 70%; height: 100vh; 
                background: var(--card-bg); 
                flex-direction: column; 
                justify-content: center; 
                align-items: center; 
                transition: 0.4s; 
                backdrop-filter: blur(20px); 
            }
            .nav-links.active { right: 0; }
            .burger { display: flex; }
        }

        .container-wrapper { 
            perspective: 1500px; 
            padding: 100px 20px 40px; 
            display: flex; 
            justify-content: center;
            align-items: center;
        }
        .container { 
            padding: 45px 40px; 
            background: var(--card-bg); 
            border-radius: 20px; 
            backdrop-filter: blur(15px); 
            max-width: 600px; 
            width: 100%; 
            text-align: center;
            box-shadow: 
                0 0 40px var(--glow), 
                0 8px 32px rgba(0,0,0,0.6),
                inset 0 0 20px rgba(255,71,87,0.05);
            transform-style: preserve-3d; 
            transition: transform 0.1s ease-out;
            animation: fadeInUp 1s ease-out forwards;
            position: relative;
            overflow: hidden;
        }
        /* Анимированный градиентный бордер */
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--gradient-1), var(--gradient-2), var(--gradient-3), var(--gradient-1));
            background-size: 400% 400%;
            z-index: -1;
            border-radius: 22px;
            animation: gradientBorder 8s ease infinite;
            opacity: 0.6;
        }
        @keyframes gradientBorder {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* 3D Аватарка */
        .avatar { 
            width: 120px; height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid transparent;
            background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                        linear-gradient(135deg, var(--gradient-1), var(--gradient-2), var(--gradient-3)) border-box;
            margin-bottom: 25px; 
            box-shadow: 0 0 30px var(--glow);
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
        }
        .avatar:hover {
            transform: rotateY(180deg) scale(1.1);
        }
        
        /* Градиентный текст заголовка */
        .typewriter h1 { 
            overflow: hidden; 
            border-right: 2px solid var(--accent); 
            white-space: nowrap; 
            margin: 0 auto 20px; 
            animation: typing 3s steps(30) forwards, blink 0.7s step-end infinite; 
            font-size: 2.5em;
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2), var(--gradient-3));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: typing 3s steps(30) forwards, blink 0.7s step-end infinite, gradientShift 5s ease infinite;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .glitch:hover { animation: glitch 0.3s infinite; }
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { 50% { border-color: transparent; } }
        @keyframes glitch { 0%,100% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(2px, -2px); } 60% { transform: translate(-2px, -2px); } 80% { transform: translate(2px, 2px); } }

        p { font-size: 1.1em; line-height: 1.7; color: var(--text); opacity: 0.8; margin-bottom: 25px; }
        
        .clock { 
            font-family: monospace; 
            font-size: 1.2em; 
            background: linear-gradient(90deg, var(--gradient-1), var(--gradient-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px; 
            letter-spacing: 2px; 
        }

        /* 3D Кнопки */
        .btn { 
            display: inline-block; 
            padding: 14px 35px; 
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
            color: white; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: bold; 
            transition: all 0.3s; 
            margin: 10px 5px; 
            border: none;
            box-shadow: 
                0 4px 15px rgba(255,71,87,0.4),
                0 0 20px rgba(155,89,182,0.2),
                inset 0 -3px 0 rgba(0,0,0,0.2);
            transform: translateY(0);
        }
        .btn:hover { 
            transform: translateY(-3px) scale(1.05); 
            box-shadow: 
                0 8px 25px rgba(255,71,87,0.6),
                0 0 30px rgba(155,89,182,0.4),
                inset 0 -3px 0 rgba(0,0,0,0.2);
        }
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(255,71,87,0.3);
        }
        
        .socials { margin-top: 30px; display: flex; justify-content: center; gap: 25px; }
        .socials a { 
            color: var(--text); 
            opacity: 0.7; 
            text-decoration: none; 
            transition: all 0.3s;
            position: relative;
        }
        .socials a:hover { 
            opacity: 1; 
            background: linear-gradient(90deg, var(--gradient-1), var(--gradient-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Плеер с градиентами */
        .player { 
            margin-top: 30px; 
            padding: 20px; 
            background: linear-gradient(135deg, rgba(255,71,87,0.05), rgba(155,89,182,0.05));
            border-radius: 15px; 
            border: 1px solid var(--border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        .track-name { 
            font-size: 1.1em; 
            font-weight: bold; 
            margin-bottom: 10px; 
            background: linear-gradient(90deg, var(--gradient-1), var(--gradient-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-height: 1.5em; 
        }
        .progress-container { 
            width: 100%; 
            height: 6px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 3px; 
            margin: 15px 0; 
            cursor: pointer; 
            position: relative; 
            overflow: hidden;
        }
        .progress-bar { 
            height: 100%; 
            background: linear-gradient(90deg, var(--gradient-1), var(--gradient-2), var(--gradient-3));
            background-size: 200% 100%;
            animation: progressGlow 3s ease infinite;
            border-radius: 3px; 
            width: 0%; 
            transition: width 0.1s; 
        }
        @keyframes progressGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .time-display { display: flex; justify-content: space-between; font-size: 0.8em; opacity: 0.6; margin-top: 5px; }
        .controls-row { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 15px; }
        .ctrl-btn { 
            background: linear-gradient(135deg, rgba(255,71,87,0.1), rgba(155,89,182,0.1));
            border: 1px solid var(--border);
            color: var(--text); 
            font-size: 1.5em; 
            cursor: pointer; 
            transition: all 0.3s; 
            opacity: 0.7;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover { 
            opacity: 1; 
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
            transform: scale(1.15);
            box-shadow: 0 0 15px var(--glow);
        }
        .play-btn { 
            font-size: 2.2em; 
            opacity: 1;
            width: 55px;
            height: 55px;
        }
        
        .visualizer { display: flex; justify-content: center; gap: 3px; height: 30px; align-items: flex-end; margin-top: 15px; }
        .viz-bar { 
            width: 4px; 
            background: linear-gradient(to top, var(--gradient-1), var(--gradient-2));
            border-radius: 2px; 
            height: 5px; 
            transition: height 0.15s ease; 
        }

        /* Таймлайн с градиентами */
        .timeline { 
            margin-top: 40px; 
            text-align: left; 
            border-left: 2px solid transparent;
            border-image: linear-gradient(to bottom, var(--gradient-1), var(--gradient-2), var(--gradient-3)) 1;
            padding-left: 20px; 
        }
        .timeline-item { margin-bottom: 20px; position: relative; }
        .timeline-item::before { 
            content: ''; 
            position: absolute; 
            left: -26px; 
            top: 5px; 
            width: 10px; 
            height: 10px; 
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
            border-radius: 50%; 
            box-shadow: 0 0 10px var(--gradient-1); 
        }
        .timeline-date { font-size: 0.8em; color: var(--gradient-1); font-weight: bold; }
        .timeline-text { font-size: 0.95em; opacity: 0.8; }

        /* Достижения с цветными рангами */
        .achievements { 
            margin-top: 40px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 10px; 
        }
        .achievement { 
            background: rgba(255,255,255,0.03); 
            padding: 12px 8px; 
            border-radius: 12px; 
            text-align: center; 
            opacity: 0.15; 
            transition: all 0.5s; 
            border: 2px solid transparent;
            position: relative;
            filter: grayscale(100%) blur(2px);
        }
        .achievement.unlocked { 
            opacity: 1; 
            filter: grayscale(0%) blur(0);
            transform: scale(1.05);
            animation: unlockPop 0.6s ease-out;
        }
        @keyframes unlockPop {
            0% { transform: scale(0.5) rotateY(0); opacity: 0; }
            50% { transform: scale(1.2) rotateY(180deg); }
            100% { transform: scale(1.05) rotateY(360deg); opacity: 1; }
        }
        
        .achievement.common { 
            border-color: var(--common); 
            box-shadow: 0 0 10px rgba(149,165,166,0.3);
        }
        .achievement.rare { 
            border-color: var(--rare); 
            box-shadow: 0 0 15px rgba(52,152,219,0.4);
        }
        .achievement.epic { 
            border-color: var(--epic); 
            box-shadow: 0 0 20px rgba(155,89,182,0.5);
        }
        .achievement.legendary { 
            border-color: var(--legendary); 
            box-shadow: 0 0 25px rgba(243,156,18,0.6);
            animation: legendaryPulse 2s ease-in-out infinite;
        }
        @keyframes legendaryPulse {
            0%, 100% { box-shadow: 0 0 25px rgba(243,156,18,0.6); }
            50% { box-shadow: 0 0 35px rgba(243,156,18,0.9); }
        }
        
        .achievement-icon { font-size: 1.8em; margin-bottom: 5px; }
        .achievement-name { font-size: 0.7em; line-height: 1.2; }
        .achievement-rank { 
            position: absolute; 
            top: -5px; 
            right: -5px; 
            font-size: 0.6em; 
            padding: 2px 6px; 
            border-radius: 8px; 
            font-weight: bold;
        }
        .achievement.common .achievement-rank { background: var(--common); color: #000; }
        .achievement.rare .achievement-rank { background: var(--rare); color: #fff; }
        .achievement.epic .achievement-rank { background: var(--epic); color: #fff; }
        .achievement.legendary .achievement-rank { background: var(--legendary); color: #000; }

        .controls { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
        .control-btn { 
            width: 45px; height: 45px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
            border: 1px solid var(--border); 
            color: var(--text); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.2em; 
            backdrop-filter: blur(10px); 
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .control-btn:hover { 
            transform: scale(1.15) rotate(15deg); 
            box-shadow: 0 0 20px var(--glow); 
        }

        /* Уведомление о разблокировке */
        .achievement-popup {
            position: fixed;
            top: 80px;
            right: 20px;
            background: linear-gradient(135deg, var(--card-bg), rgba(155,89,182,0.3));
            border: 2px solid var(--accent);
            border-radius: 15px;
            padding: 15px 20px;
            z-index: 1000;
            animation: slideIn 0.5s ease-out, fadeOut 0.5s ease-in 2.5s forwards;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 30px var(--glow);
        }
        @keyframes slideIn { from { transform: translateX(100%) rotateY(-90deg); opacity: 0; } to { transform: translateX(0) rotateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }
        .popup-icon { font-size: 1.5em; }
        .popup-text { font-size: 0.9em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="parallax-bg" id="parallaxBg"></div>
    <div class="overlay"></div>
    
    <nav>
        <div style="font-weight:bold; background: linear-gradient(90deg, var(--gradient-1), var(--gradient-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Azoity</div>
        <div class="nav-links" id="navLinks">
            <a href="#bio">Био</a>
            <a href="#path">Путь</a>
            <a href="#achievements">Достижения</a>
        </div>
        <div class="burger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <div class="container-wrapper">
        <div class="container" id="tiltCard">
            <img src="images/avatar.jpg" alt="Azoity" class="avatar">
            <div class="typewriter"><h1 class="glitch">Azoity bio</h1></div>
            <div class="clock" id="clock">00:00:00</div>
            <p>Добро пожаловать в моё цифровое пространство.</p>
            
            <button class="btn" onclick="copyTg()">📋 Связаться со мной</button>
